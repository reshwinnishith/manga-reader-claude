name: Phase 1 checks

on:
  push:
    branches:
      - fix/phase1-provider-hardening
  pull_request:
    branches:
      - feat/in-app-providers

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
